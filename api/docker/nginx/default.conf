server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;

    # Precisa acomodar o maior video aceito pela API (config fiapx.upload).
    client_max_body_size 512M;

    # Upload de video e lento: o padrao de 60s derrubaria conexoes legitimas.
    client_body_timeout 300s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # ffmpeg pode levar minutos; o timeout precisa cobrir o upload completo.
        fastcgi_read_timeout 300s;
    }

    # Nada fora do public deve ser servido diretamente.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
