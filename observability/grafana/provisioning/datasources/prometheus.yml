apiVersion: 1

datasources:
  - name: Prometheus
    # uid fixo para que os painéis do dashboard provisionado possam
    # referenciá-lo sem depender de um id gerado na primeira subida.
    uid: fiapx-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
