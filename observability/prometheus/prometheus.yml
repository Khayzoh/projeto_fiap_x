global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    projeto: fiapx

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # O worker roda em varias replicas; o Docker resolve "worker" para todos
  # os containers do servico, entao o Prometheus coleta de cada um.
  - job_name: fiapx-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
    metrics_path: /metrics

  - job_name: fiapx-api
    static_configs:
      - targets: ["nginx:80"]
    metrics_path: /api/metrics

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
    # O /metrics padrão do RabbitMQ agrega todas as filas numa série só, o que
    # impede separar a fila de processamento da dead letter queue. O
    # /metrics/per-object quebra por fila, com o label "queue".
    #
    # Em um broker com centenas de filas esse endpoint fica caro; aqui são três.
    metrics_path: /metrics/per-object
