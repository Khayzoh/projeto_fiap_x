apiVersion: v1
kind: ConfigMap
metadata:
  name: fiapx-config
  namespace: fiapx
data:
  APP_NAME: "FIAP X"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: http://fiapx.local

  LOG_CHANNEL: stack
  LOG_LEVEL: info

  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: fiapx
  DB_USERNAME: fiapx

  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: sync

  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: fiapx
  RABBITMQ_VHOST: "/"

  STORAGE_DISK: s3
  STORAGE_PUBLIC_DISK: s3_public
  STORAGE_BUCKET: fiapx-videos
  STORAGE_REGION: us-east-1
  STORAGE_ENDPOINT: minio:9000
  STORAGE_ENDPOINT_URL: http://minio:9000
  STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:9000
  STORAGE_PATH_STYLE: "true"
  STORAGE_USE_SSL: "false"

  PROCESSING_FPS: "1"
  UPLOAD_MAX_SIZE_KB: "512000"
  DOWNLOAD_URL_TTL_MINUTES: "15"
  WORKER_PREFETCH: "2"
  WORKER_MAX_RETRY: "3"

  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: nao-responda@fiapx.local
  MAIL_FROM_NAME: "FIAP X"

---
# Modelo de Secret para uso local.
#
# Em producao NAO aplique este arquivo: os valores devem vir do pipeline
# (kubectl create secret --from-literal) ou de um gestor de segredos
# (AWS Secrets Manager, Sealed Secrets, External Secrets Operator).
apiVersion: v1
kind: Secret
metadata:
  name: fiapx-secret
  namespace: fiapx
type: Opaque
stringData:
  APP_KEY: "base64:TROQUE_POR_UMA_CHAVE_DE_32_BYTES"
  JWT_SECRET: "TROQUE_POR_UM_SEGREDO_LONGO_E_ALEATORIO"
  DB_PASSWORD: "fiapx"
  RABBITMQ_PASSWORD: "fiapx"
  STORAGE_ACCESS_KEY: "fiapxadmin"
  STORAGE_SECRET_KEY: "fiapxadmin123"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fiapx-nginx-config
  namespace: fiapx
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        client_max_body_size 512M;
        client_body_timeout 300s;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        error_page 404 /index.php;

        location ~ \.php$ {
            # php-fpm no mesmo pod: o sidecar responde em localhost.
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_read_timeout 300s;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
