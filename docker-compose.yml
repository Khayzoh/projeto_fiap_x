# Ambiente completo da FIAP X para desenvolvimento e demonstracao.
#
#   docker compose up -d --build
#   docker compose up -d --scale worker=3    # prova de processamento paralelo
#
# Portas expostas no host:
#   8080  API            15672 RabbitMQ (admin)   9001 MinIO (console)
#   8025  Mailpit        9090  Prometheus         3001 Grafana

name: fiapx

services:
  postgres:
    image: postgres:16-alpine
    container_name: fiapx-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fiapx}
      POSTGRES_USER: ${DB_USERNAME:-fiapx}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fiapx}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # O DDL versionado fica em database/schema.sql (entregavel da fase).
      # Aqui as tabelas sao criadas por "php artisan migrate", que e a fonte
      # da verdade do schema; montar o SQL no initdb duplicaria a criacao.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fiapx} -d ${DB_DATABASE:-fiapx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fiapx]

  redis:
    image: redis:7-alpine
    container_name: fiapx-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [fiapx]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fiapx-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fiapx}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fiapx}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [fiapx]

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: fiapx-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-fiapxadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-fiapxadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fiapx]

  # Cria o bucket na primeira subida e encerra.
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: fiapx-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-fiapxadmin} ${STORAGE_SECRET_KEY:-fiapxadmin123} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-fiapx-videos} &&
      echo 'bucket pronto'
      "
    networks: [fiapx]

  # Servidor SMTP de desenvolvimento: captura as notificacoes de erro
  # sem enviar e-mail de verdade. Interface web em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: fiapx-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [fiapx]

  api:
    build:
      context: ./api
      dockerfile: docker/php/Dockerfile
    container_name: fiapx-api
    env_file: [.env]
    environment:
      CONTAINER_ROLE: app
    volumes:
      - ./api:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [fiapx]

  nginx:
    image: nginx:1.27-alpine
    container_name: fiapx-nginx
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html
      - ./api/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks: [fiapx]

  # Consumidor dos eventos de resultado: atualiza o status no banco
  # e dispara a notificacao por e-mail em caso de falha.
  api-consumer:
    build:
      context: ./api
      dockerfile: docker/php/Dockerfile
    container_name: fiapx-api-consumer
    env_file: [.env]
    environment:
      CONTAINER_ROLE: consumer
    command: php artisan fiapx:consume-status
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: [fiapx]

  # Worker de processamento. Escalar com:
  #   docker compose up -d --scale worker=3
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-fiapx}:${RABBITMQ_PASSWORD:-fiapx}@rabbitmq:5672/
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-fiapxadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-fiapxadmin123}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-fiapx-videos}
      WORKER_PREFETCH: ${WORKER_PREFETCH:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    networks: [fiapx]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: fiapx-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [fiapx]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: fiapx-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # 3000 costuma estar ocupada em maquina de desenvolvimento; ajuste
      # GRAFANA_PORT no .env se 3001 tambem conflitar.
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [fiapx]

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  prometheus-data:
  grafana-data:

networks:
  fiapx:
    driver: bridge
