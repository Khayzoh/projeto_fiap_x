# Pipeline de CI para o GitLab.
#
# Espelha o que .github/workflows/ci.yml faz no GitHub Actions: os dois
# permanecem no repositório para que o projeto rode em qualquer um dos dois
# hospedeiros sem alteração.

stages:
  - teste
  - integracao
  - qualidade

variables:
  GO_VERSION: "1.23"
  COVERAGE_MIN: "80"
  # Necessário para o docker-in-docker do job de integração.
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# -----------------------------------------------------------------------------
worker:
  stage: teste
  image: golang:1.23-alpine
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths: [.go-cache]
  variables:
    GOPATH: $CI_PROJECT_DIR/.go-cache
  before_script:
    # Os testes do extrator geram vídeos sintéticos com o próprio ffmpeg.
    - apk add --no-cache ffmpeg
    - cd worker
  script:
    - |
      nao_formatados=$(gofmt -l .)
      if [ -n "$nao_formatados" ]; then
        echo "Arquivos fora do padrão gofmt:"; echo "$nao_formatados"; exit 1
      fi
    - go vet ./...
    - go test ./... -race -coverprofile=coverage.out -covermode=atomic
    # O gate cobre domínio, caso de uso, configuração e o adaptador de vídeo.
    # RabbitMQ e MinIO exigem serviços reais e são exercitados na integração.
    - |
      go test ./internal/domain/... ./internal/usecase/... \
              ./internal/config/... ./internal/adapter/video/... \
              -coverprofile=negocio.out
      total=$(go tool cover -func=negocio.out | tail -1 | awk '{print substr($3, 1, length($3)-1)}')
      echo "Cobertura dos pacotes de negócio: ${total}%"
      awk "BEGIN {exit !($total < ${COVERAGE_MIN})}" && {
        echo "Cobertura abaixo do mínimo de ${COVERAGE_MIN}%"; exit 1
      }
    - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/worker ./cmd/worker
  coverage: '/Cobertura dos pacotes de negócio: (\d+\.\d+)%/'
  artifacts:
    paths: [worker/coverage.out]
    expire_in: 1 week

# -----------------------------------------------------------------------------
api:
  stage: teste
  image: php:8.4-cli
  cache:
    key: composer-$CI_COMMIT_REF_SLUG
    paths: [api/vendor]
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip libzip-dev libsqlite3-dev
    - docker-php-ext-install -j"$(nproc)" bcmath sockets zip pcntl pdo_sqlite
    - pecl install pcov && docker-php-ext-enable pcov
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - cd api
    - composer install --no-interaction --prefer-dist --no-progress
  script:
    - vendor/bin/pint --test
    - vendor/bin/phpunit --coverage-clover coverage.xml --log-junit junit.xml
    - |
      php -r '
        $xml = simplexml_load_file("coverage.xml");
        $m = $xml->project->metrics;
        $cob = ($m["statements"] > 0)
          ? round(($m["coveredstatements"] / $m["statements"]) * 100, 2) : 0;
        echo "Cobertura de linhas: {$cob}%\n";
        if ($cob < (float) getenv("COVERAGE_MIN")) {
          fwrite(STDERR, "Cobertura abaixo do mínimo\n"); exit(1);
        }
      '
  coverage: '/Cobertura de linhas: (\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit: api/junit.xml
    paths: [api/coverage.xml]
    expire_in: 1 week

# -----------------------------------------------------------------------------
integracao:
  stage: integracao
  image: docker:27-cli
  services:
    - docker:27-dind
  needs: [worker, api]
  before_script:
    - apk add --no-cache bash curl unzip
  script:
    - cp .env.example .env
    - sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(head -c 32 /dev/urandom | base64 | tr -d '\n')|" .env
    - sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(head -c 48 /dev/urandom | base64 | tr -d '\n')|" .env
    - docker compose up -d --build
    - |
      for tentativa in $(seq 1 60); do
        if curl -fsS http://localhost:8080/api/health > /dev/null 2>&1; then
          echo "API no ar após ${tentativa} tentativas"; break
        fi
        [ "$tentativa" = "60" ] && { docker compose logs --tail 100; exit 1; }
        sleep 5
      done
    - docker compose exec -T api php artisan migrate --force
    - bash scripts/smoke-test.sh
  after_script:
    - docker compose logs --tail 200 || true
    - docker compose down -v || true

# -----------------------------------------------------------------------------
manifestos:
  stage: qualidade
  image:
    name: ghcr.io/yannh/kubeconform:latest
    entrypoint: [""]
  script:
    - /kubeconform -strict -summary -kubernetes-version 1.30.0 k8s/

seguranca:
  stage: qualidade
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    # Não bloqueia o merge: o relatório é informativo.
    - trivy fs --scanners vuln --severity CRITICAL,HIGH --exit-code 0 --no-progress .
  allow_failure: true
